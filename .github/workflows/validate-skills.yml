name: Validate Agent Skills

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run local validator tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Skill Builder package
        run: python skills/skill-builder/scripts/validate_skill.py skills/skill-builder

      - name: Install Agent Skills reference validator
        run: python -m pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Run reference validator
        run: skills-ref validate skills/skill-builder
